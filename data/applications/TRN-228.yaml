  sup: [un]  # Supervision
  pt: bat  # Processing time
  ep: [prec]  # Evaluation priority
  out: [rank, disc]  # Required outputs
  oc: [div, scale]  # Operational constraints
  adv: "no"  # Adversary
  dq: [multi]  # Data characteristics
