id: FIN-001
name: Card-present (POS) fraud
domain: FIN
subdomain: Payments & cards
description: In-store card transactions scored at authorization. Counterfeit or skimmed cards show impossible travel, unusual merchant categories and spend bursts relative to the cardholder's own history.
properties:
  mod: [tab, st]  # Data modality
  at: [ctx, glob, seq]  # Anomaly type
  unit: [rec, ent]  # Detection unit
  ar: vl  # Anomaly ratio
  dim: me  # Dimensionality
  sup: [sup, weak]  # Supervision
  pt: on  # Processing time
  ep: [prec, spec]  # Evaluation priority
  out: [sev, xai]  # Required outputs
  oc: [scale, drift, reg, hitl]  # Operational constraints
  adv: adapt  # Adversary
  dq: [mix, het]  # Data characteristics
evidence: {}
references:
