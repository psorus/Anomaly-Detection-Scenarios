id: MFG-161
name: Screw driving and joining process monitoring
domain: MFG
subdomain: Process monitoring & quality
description: "Torque and angle curves recorded for every screw joint. Faulty joints from worn threads, contamination or wrong parts produce curve shapes that differ subtly from good ones; the decision is made before the part moves on."
