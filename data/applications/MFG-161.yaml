  at: [seq, glob]  # Anomaly type
  unit: [ser]  # Detection unit
  ar: lo  # Anomaly ratio
  dim: lo  # Dimensionality
  sup: [nov, sup]  # Supervision
  pt: hrt  # Processing time
  ep: [rec, spec]  # Evaluation priority
  out: [type]  # Required outputs
  oc: [edge]  # Operational constraints
  adv: "no"  # Adversary
  dq: []  # Data characteristics
evidence: {}
references: []
