id: MFG-158
name: Video monitoring of industrial processes
domain: MFG
subdomain: Process monitoring & quality
description: Cameras watching machines and production steps that repeat periodically, such as presses, pick-and-place units and conveyors. Anomalies are deviations in motion, timing or sequence and must be localized in time.
properties:
  mod: [vid]  # Data modality
  at: [seq, ctx]  # Anomaly type
  unit: [win]  # Detection unit
  ar: lo  # Anomaly ratio
  dim: hi  # Dimensionality
  sup: [nov]  # Supervision
  pt: "on"  # Processing time
  ep: [rec, time]  # Evaluation priority
  out: [loc]  # Required outputs
  oc: [shift]  # Operational constraints
  adv: "no"  # Adversary
  dq: []  # Data characteristics
evidence: {}
references: []
