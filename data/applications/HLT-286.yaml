id: HLT-286
name: Implausible records in clinical registries
domain: HLT
subdomain: Clinical data & operations
description: "Cancer registry and EHR records with implausible combinations of diagnosis, staging, therapy and dates. Batch processing is fine; reviewers want diverse, severe issues first."
properties:
  mod: [tab]  # Data modality
  at: [log, glob, loc]  # Anomaly type
  unit: [rec]  # Detection unit
  ar: lo  # Anomaly ratio
  dim: me  # Dimensionality
  sup: [un]  # Supervision
  pt: bat  # Processing time
  ep: [rec, prec]  # Evaluation priority
  out: [xai, fix, rank]  # Required outputs
  oc: [div, reg, rob]  # Operational constraints
  adv: "no"  # Adversary
  dq: [mix, miss]  # Data characteristics
evidence: {}
references:
  - ref: "[3]"
    citation: "Röchner and Rothlauf (2023). Unsupervised anomaly detection of implausible electronic health records: a real-world evaluation in cancer registries. BMC Medical Research Methodology."
    context: "Introduction and Example 2.2: quality control for medical databases."
review:
  status: draft
  reviewers: []
