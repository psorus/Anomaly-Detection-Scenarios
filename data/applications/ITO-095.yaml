id: ITO-095
name: Log anomaly detection
domain: ITO
subdomain: Monitoring & AIOps
description: System logs parsed into templates. Anomalies are unusual event sequences, unseen templates or parameter values. Software updates change templates constantly.
properties:
  mod: [seq, txt]  # Data modality
  at: [seq, sem, glob]  # Anomaly type
  unit: [win, ser]  # Detection unit
  ar: lo  # Anomaly ratio
  dim: hi  # Dimensionality
  sup: [nov, weak]  # Supervision
  pt: "on"  # Processing time
  ep: [prec, time]  # Evaluation priority
  out: [loc, rca, grp]  # Required outputs
  oc: [drift, scale, rob]  # Operational constraints
  adv: "no"  # Adversary
  dq: []  # Data characteristics
evidence: {}
references:
