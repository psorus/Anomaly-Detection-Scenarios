  pt: "on"  # Processing time
  ep: [rec, spec]  # Evaluation priority
  out: [rca, loc]  # Required outputs
  oc: [drift, shift]  # Operational constraints
  adv: "no"  # Adversary
  dq: [het]  # Data characteristics
