  ar: lo  # Anomaly ratio
  dim: hi  # Dimensionality
  sup: [un]  # Supervision
  pt: bat  # Processing time
  ep: [rec]  # Evaluation priority
  out: [loc, xai, rank]  # Required outputs
  oc: [reg, div]  # Operational constraints
  adv: "no"  # Adversary
  dq: [het]  # Data characteristics
