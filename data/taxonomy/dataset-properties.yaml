# Properties of datasets. In dataset files: tier, labels (lab), anomaly_origin (real), annotations (ann).
properties:
  - key: tier
    label: Readiness tier
    values:
      - code: generic
        label: Generic collection
        desc: Aggregates datasets from unrelated applications under one protocol (e.g., ADBench, TSB-AD). A reference point, but not scenario-specific, so it does not count toward a scenario's minimum.
      - code: suite
        label: Benchmark suite
        desc: Several datasets from one application area with a shared protocol, splits and baselines.
      - code: bench
        label: Benchmark dataset
        desc: One curated dataset with ground truth and an established split or protocol, used across many papers.
      - code: app
        label: Application data
        desc: "Released with an applied study, a competition or by an operator. Realistic but messy: missing values, irregular sampling, partial labels, no fixed protocol."
  - key: lab
    label: Labels
    values:
      - code: full
        label: Full ground truth
        desc: Every anomaly in the evaluation data is labeled.
      - code: partial
        label: Partial labels
        desc: "Only some anomalies are labeled (confirmed cases, operator logs); unlabeled does not mean normal."
      - code: weak
        label: Weak labels
        desc: Labels at a coarser level than the detection unit (video-level, bag-level) or known to be noisy.
      - code: none
        label: Unlabeled
        desc: "No anomaly labels; usable with injected anomalies or expert review. Not counted toward scenario minimums."
  - key: real
    label: Anomaly origin
    values:
      - code: real
        label: Real anomalies
        desc: Real data with naturally occurring or physically produced anomalies.
      - code: semi
        label: Injected anomalies
        desc: Real normal data with synthetic or injected anomalies.
      - code: sim
        label: Simulated
        desc: Generated by a simulator or synthetic process.
  - key: ann
    label: Annotations beyond binary labels
    values:
      - code: loc
        label: Localization
        desc: Pixel masks, time intervals, text spans, points or affected channels.
      - code: type
        label: Anomaly classes
        desc: Fault, attack, defect or event categories.
      - code: sev
        label: Severity grades
        desc: Graded severity, damage level, fault size or intensity.
      - code: rca
        label: Root cause
        desc: Faulty component, variable, service or attack target.
      - code: grp
        label: Group labels
        desc: Membership in rings, campaigns, events or duplicate buckets.
      - code: fix
        label: Clean values
        desc: Ground-truth correct values for repair.
      - code: txt
        label: Text descriptions
        desc: Natural-language descriptions or causes of anomalies.
      - code: rul
        label: Time to event
        desc: Event onset or failure times for lead-time evaluation.
      - code: ent
        label: Entity histories
        desc: Stable entity identifiers with history (accounts, machines, patients), so per-entity baselines can be learned.
      - code: prot
        label: Protected attributes
        desc: Demographic or other protected attributes for fairness evaluation.
      - code: xdom
        label: Domain splits
        desc: Several categories, machines, sites or operating conditions for transfer evaluation.
