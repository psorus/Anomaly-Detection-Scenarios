# Dataset D141. `applications` lists the applications it comes from, most representative first.
# Scenario membership is computed from those applications, the modality and the annotations.
id: D141
name: Exathlon
year: "2021"
tier: bench  # generic | suite | bench | app
labels: full  # full | partial | weak | none
anomaly_origin: real  # real | semi | sim
annotations: [loc, type, rca, ent]
modality: [mts]
size: About 100 Spark streaming traces with executed disturbances
description: "Explainable anomaly detection benchmark: CPU contention, bursty input, stalled input, driver and executor failures, with root-cause events and explanation metrics."
applications: [ITO-094, ITO-106]
links:
  page:
    url: "https://github.com/exathlonbenchmark/exathlon"
    found_in_search: false
  other:
    - label: Paper (arXiv)
      url: "https://arxiv.org/abs/2010.05073"
references: []
