# Posts the impact report from "Check pull request" as a single, updated comment on the pull request.
# It runs in the context of the base repository but never checks out or executes pull request code;
# the report is treated as plain text.
name: Comment impact report

on:
  workflow_run:
    workflows: ["Check pull request"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atlas-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const num = parseInt(fs.readFileSync("report/pr_number", "utf8").trim(), 10);
            if (!Number.isInteger(num) || num <= 0) { core.setFailed("No pull request number in the report."); return; }
            const pr = await github.rest.pulls.get({ ...context.repo, pull_number: num });
            if (pr.data.head.sha !== context.payload.workflow_run.head_sha) { core.info("Report is for an older commit; skipping."); return; }
            const marker = "<!-- atlas-impact-report -->";
            let body = fs.readFileSync("report/report.md", "utf8").slice(0, 60000);
            const run = context.payload.workflow_run;
            const ok = run.conclusion === "success";
            body = `${marker}\n${body}\n${ok ? "All checks passed." : "**Some checks failed.** Open the checks tab for the exact file and line."} ` +
                   `[Workflow run and site preview](${run.html_url}).\n`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: num, per_page: 100 });
            const mine = comments.find(c => c.user.type === "Bot" && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: num, body });
