# Generated by `python scripts/atlas.py forms` from data/taxonomy. Do not edit by hand.
name: Propose an application
description: Add an anomaly detection application to the atlas.
title: "[New application] "
labels: [new application]
body:
  - type: markdown
    attributes:
      value: "Propose an application of anomaly detection. A maintainer checks the proposal, adds the `accepted` label, and a workflow opens a pull request with the file. You can also [write the file directly](../tree/main/data/applications)."
  - type: input
    attributes:
      label: Name
      description: Short name, as practitioners would say it.
      placeholder: Card-present (POS) fraud
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Domain
      description: The field the application comes from.
      options:
        - Finance, insurance & accounting (FIN)
        - Cybersecurity (SEC)
        - IT operations & software (ITO)
        - Data & ML systems (MLD)
        - Manufacturing & industry (MFG)
        - Energy & utilities (ENE)
        - Transportation & mobility (TRN)
        - Aerospace & space (AER)
        - Healthcare & medicine (HLT)
        - Life sciences & biotech (LIF)
        - Physical & earth sciences (SCI)
        - Environment & agriculture (ENV)
        - Buildings, cities & infrastructure (BLD)
        - Retail, e-commerce & marketing (RET)
        - Telecommunications (TEL)
        - Online platforms & social media (WEB)
        - Government & public sector (PUB)
        - Public safety & surveillance (SAF)
        - Business processes & HR (BIZ)
        - Education, sports & media (EDU)
    validations:
      required: true
  - type: input
    attributes:
      label: Subdomain
      description: A finer area within the domain.
      placeholder: Payments & cards
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: "Two or three sentences: what is scored, what counts as an anomaly, who acts on it."
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Data modality
      description: "The form of the raw data the detector consumes. Paper values: tabular, time series, image/spatial, text, graph. Split here into finer modalities because each implies different inductive biases. Tick every value that applies; the most important first in the description if it matters."
      options:
        - label: Tabular records (tab)
        - label: Univariate time series (ts)
        - label: Multivariate time series (mts)
        - label: Event sequences & logs (seq)
        - label: High-frequency signals (sig)
        - label: Images (img)
        - label: Video (vid)
        - label: "3D volumes (vol)"
        - label: Point clouds & 3D surfaces (pc)
        - label: Remote sensing & spectra (rs)
        - label: Text & documents (txt)
        - label: Code & binaries (code)
        - label: Static graph (gr)
        - label: Dynamic graph / interactions (dg)
        - label: Spatio-temporal & trajectories (st)
  - type: checkboxes
    attributes:
      label: Anomaly type
      description: "How anomalies differ from normal data. Paper values: global, local, clustered, contextual/sequential. Extended with change, dependency, structural, semantic and logical anomalies. Tick every value that applies; the most important first in the description if it matters."
      options:
        - label: Global (glob)
        - label: Local (loc)
        - label: Clustered (clu)
        - label: Contextual (ctx)
        - label: Sequential / collective (seq)
        - label: Change / shift (cp)
        - label: Dependency break (dep)
        - label: Structural (graph) (str)
        - label: Semantic novelty / OOD (sem)
        - label: Logical / constraint (log)
  - type: checkboxes
    attributes:
      label: Detection unit
      description: "What the detector scores. Not in the paper's Table 1, but it determines the algorithm family (point scorer vs. sequence model vs. segmentation vs. graph model) and the metric (point-wise vs. range-based vs. pixel-level). Tick every value that applies; the most important first in the description if it matters."
      options:
        - label: Record / event (rec)
        - label: Window / interval (win)
        - label: Whole series / session (ser)
        - label: Whole sample (obj)
        - label: Region within sample (reg)
        - label: Node (node)
        - label: Edge / interaction (edge)
        - label: Group / subgraph (sub)
        - label: Entity over time (ent)
  - type: dropdown
    attributes:
      label: Anomaly ratio
      description: Typical share of anomalies in the data the detector sees. Drives evaluation protocol (bootstrapping, confidence intervals) and contamination assumptions.
      options: ["Very low (<1%) (vl)", "Low (1–5%) (lo)", "Moderate (>5%) (mo)"]
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Dimensionality
      description: Number of features or channels per unit, after typical preprocessing. Raw images, text and genomics count as high.
      options: ["Low (<10) (lo)", "Medium (10–100) (me)", "High (>100) (hi)"]
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Supervision
      description: "Label regimes that are realistic in the application (first listed is the most common). The paper's 'semi-supervised' is split into one-class novelty detection and weak supervision because the two are often conflated. Tick every value that applies; the most important first in the description if it matters."
      options:
        - label: Unsupervised (un)
        - label: One-class / novelty (nov)
        - label: Weak / semi-supervised (weak)
        - label: Supervised (sup)
  - type: dropdown
    attributes:
      label: Processing time
      description: "The strictest latency the application typically requires. The paper uses real-time/online vs batch/offline; real-time is split into hard inline decisions and streaming alerting."
      options: [Hard real-time / inline (hrt), Online / streaming (on), Batch / offline (bat)]
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Evaluation priority
      description: "Which error matters most (first listed is primary). Determines the metric family. 'Timeliness' is added because detection delay is the key objective in monitoring. Tick every value that applies; the most important first in the description if it matters."
      options:
        - label: Precision (prec)
        - label: Recall (rec)
        - label: Specificity (spec)
        - label: Timeliness (time)
  - type: checkboxes
    attributes:
      label: Required outputs
      description: "What users need beyond an anomaly flag. Severity, grouping and explanations are rarely benchmarked but often decide whether a detector is usable. Tick every value that applies; the most important first in the description if it matters."
      options:
        - label: Severity score (sev)
        - label: Ranked queue (rank)
        - label: Grouping (grp)
        - label: Explanation (xai)
        - label: Localization (loc)
        - label: Root cause (rca)
        - label: Anomaly type (type)
        - label: Early warning (early)
        - label: Discovery (disc)
        - label: Correction (fix)
        - label: Calibrated uncertainty (unc)
  - type: checkboxes
    attributes:
      label: Operational constraints
      description: "Deployment constraints. Paper values: robustness, fairness, diversity. Extended with drift, privacy, edge, scale, regulation, certification, feedback, cold start and transfer. Tick every value that applies; the most important first in the description if it matters."
      options:
        - label: Robustness (rob)
        - label: Fairness (fair)
        - label: Diversity (div)
        - label: Drift adaptation (drift)
        - label: Privacy / federated (priv)
        - label: Edge / embedded (edge)
        - label: Extreme scale (scale)
        - label: Regulatory audit (reg)
        - label: Safety certification (cert)
        - label: Human feedback loop (hitl)
        - label: Cold start (cold)
        - label: Cross-domain transfer (shift)
  - type: dropdown
    attributes:
      label: Adversary
      description: "Whether anomalies are produced by an agent that hides them. The paper treats adversarial anomalies as a scenario of their own; here it is an explicit property."
      options: [None (no), Concealing (conc), Adaptive adversary (adapt)]
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Data characteristics
      description: "Data properties that constrain preprocessing and algorithms (e.g., normalization that compresses tails, encoders for categoricals). Tick every value that applies; the most important first in the description if it matters."
      options:
        - label: Mixed / categorical (mix)
        - label: Missing / irregular (miss)
        - label: Seasonality (season)
        - label: Multi-source fusion (multi)
        - label: Hierarchical (hier)
        - label: Heterogeneous entities (het)
        - label: Small data (small)
  - type: textarea
    attributes:
      label: Evidence
      description: "Sources that support the coding: papers, standards, operator reports. One per line, with section or page."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Datasets
      description: Public datasets for this application, if any (names or links).
    validations:
      required: false
