# Generated by `python scripts/atlas.py forms` from data/taxonomy. Do not edit by hand.
name: Propose a dataset
description: Add a dataset and link it to applications.
title: "[New dataset] "
labels: [new dataset]
body:
  - type: markdown
    attributes:
      value: "Propose a dataset. Link it to the applications it comes from (their ids are shown on the site, for example `FIN-001`), because scenario membership is derived from them."
  - type: input
    attributes:
      label: Name
      description: ""
    validations:
      required: true
  - type: input
    attributes:
      label: Year
      description: Year of the paper or release.
      placeholder: "2024"
    validations:
      required: false
  - type: input
    attributes:
      label: Dataset page
      description: Where the data can be downloaded.
      placeholder: "https://"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Readiness tier
      description: Readiness tier
      options:
        - Generic collection (generic)
        - Benchmark suite (suite)
        - Benchmark dataset (bench)
        - Application data (app)
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Labels
      description: How complete the anomaly labels are.
      options:
        - Full ground truth (full)
        - Partial labels (partial)
        - Weak labels (weak)
        - Unlabeled (none)
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Anomaly origin
      description: Whether the anomalies are real, injected or simulated.
      options: [Real anomalies (real), Injected anomalies (semi), Simulated (sim)]
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Annotations
      description: What the labels say beyond normal or anomalous.
      options:
        - label: Localization (loc)
        - label: Anomaly classes (type)
        - label: Severity grades (sev)
        - label: Root cause (rca)
        - label: Group labels (grp)
        - label: Clean values (fix)
        - label: Text descriptions (txt)
        - label: Time to event (rul)
        - label: Entity histories (ent)
        - label: Protected attributes (prot)
        - label: Domain splits (xdom)
  - type: checkboxes
    attributes:
      label: Data modality
      description: The form of the data.
      options:
        - label: Tabular records (tab)
        - label: Univariate time series (ts)
        - label: Multivariate time series (mts)
        - label: Event sequences & logs (seq)
        - label: High-frequency signals (sig)
        - label: Images (img)
        - label: Video (vid)
        - label: "3D volumes (vol)"
        - label: Point clouds & 3D surfaces (pc)
        - label: Remote sensing & spectra (rs)
        - label: Text & documents (txt)
        - label: Code & binaries (code)
        - label: Static graph (gr)
        - label: Dynamic graph / interactions (dg)
        - label: Spatio-temporal & trajectories (st)
  - type: input
    attributes:
      label: Applications
      description: Ids of the applications this dataset comes from, most representative first.
      placeholder: MFG-159, MFG-161
    validations:
      required: true
  - type: input
    attributes:
      label: Size
      description: Samples, channels, duration or number of sub-datasets.
      placeholder: "12 machines, 3 months at 1 Hz"
    validations:
      required: false
  - type: textarea
    attributes:
      label: Description
      description: What the data is, where it comes from and how anomalies are labeled.
    validations:
      required: true
