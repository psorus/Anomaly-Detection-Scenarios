<title>Anomaly Detection Scenario Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with view tabs; filter rail + list on wide screens, sheet + overlay detail on phones. */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --surface-2: #e9eeed; --ink: #13201e; --ink-2: #3f4f4c; --muted: #66756f;
  --line: #d3dcda; --accent: #0d5d6e; --accent-ink: #ffffff; --accent-soft: #dbeaee; --signal: #c2410c;
  --h0: #edf4f5; --h1: #cfe4e8; --h2: #a2cbd3; --h3: #6dadba; --h4: #3c8c9d; --h5: #1a6c7e; --h6: #0b4d5c;
  --t-suite: #0b4d5c; --t-bench: #2f7f90; --t-app: #7eb6c2; --t-generic: #a3adab; --minline: #c2410c;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --po: #626e6b; --pnone: #cfd6d5;
  --shadow: 0 1px 2px rgba(19,32,30,.06), 0 8px 24px rgba(19,32,30,.08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1615; --surface: #142120; --surface-2: #1b2b29; --ink: #e3ecea; --ink-2: #b2c1bd; --muted: #85948f;
  --line: #2a3b38; --accent: #62b9ca; --accent-ink: #052126; --accent-soft: #163a41; --signal: #f28a4c;
  --h0: #172a2d; --h1: #1d3c42; --h2: #24535b; --h3: #2d6c77; --h4: #3b8895; --h5: #58a7b3; --h6: #8bc9d1;
  --t-suite: #94d0d8; --t-bench: #4f9fae; --t-app: #2c6b76; --t-generic: #5d6b69; --minline: #f28a4c;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --po: #a9b4b1; --pnone: #34423f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1615; --surface: #142120; --surface-2: #1b2b29; --ink: #e3ecea; --ink-2: #b2c1bd; --muted: #85948f;
  --line: #2a3b38; --accent: #62b9ca; --accent-ink: #052126; --accent-soft: #163a41; --signal: #f28a4c;
  --h0: #172a2d; --h1: #1d3c42; --h2: #24535b; --h3: #2d6c77; --h4: #3b8895; --h5: #58a7b3; --h6: #8bc9d1;
  --t-suite: #94d0d8; --t-bench: #4f9fae; --t-app: #2c6b76; --t-generic: #5d6b69; --minline: #f28a4c;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --po: #a9b4b1; --pnone: #34423f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }
.mono { font-family: var(--f-mono); font-size: .86em; letter-spacing: 0; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; padding-block: 12px 6px; }
.brand svg { flex: none; }
.logo .n { fill: var(--accent); opacity: .85; }
.logo .a { fill: var(--signal); }
.brand h1 { font: 650 clamp(18px, 2.4vw, 22px)/1.15 var(--f-display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 0; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 9px 12px 10px; border-bottom: 2px solid transparent; color: var(--ink-2); font-weight: 500; white-space: nowrap; border-radius: 0; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); margin-left: 4px; }

main { padding-block: 22px 64px; }
.view[hidden] { display: none !important; }
.lead { display: grid; gap: 10px; max-width: 72ch; margin-bottom: 18px; }
.lead h2 { font: 700 clamp(24px, 3.6vw, 34px)/1.12 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.lead p { margin: 0; color: var(--ink-2); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 4px 0 18px; color: var(--ink-2); font-size: 13.5px; }
.facts b { font: 600 15px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 4px; }
.eyebrow { font: 500 11.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Chips and buttons */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 4px 10px; font-size: 13px; line-height: 1.3; }
button.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip .n { font-family: var(--f-mono); font-size: 11px; opacity: .75; }
.tag { display: inline-block; font-size: 12px; line-height: 1.35; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.tag.k { font-family: var(--f-mono); font-size: 11px; background: transparent; border: 1px solid var(--line); color: var(--muted); }
.badge-paper { display: inline-flex; align-items: center; gap: 5px; font: 500 11px var(--f-mono); color: var(--signal); }
.badge-paper::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--signal); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--surface-2); border-radius: 10px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* Scenario cards */
.fam { margin: 26px 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fam h3 { font: 650 18px/1.2 var(--f-display); margin: 0; }
.fam span { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.card { text-align: left; display: grid; gap: 8px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 14px; min-width: 0; }
button.card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.card .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.card h4 { font: 650 17px/1.25 var(--f-display); margin: 0; letter-spacing: -.005em; text-wrap: balance; }
.card p { margin: 0; color: var(--ink-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .sig { display: flex; flex-wrap: wrap; gap: 4px; }
.card .foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px; }
.card .foot b { color: var(--ink); font: 600 13px var(--f-mono); font-variant-numeric: tabular-nums; }

/* Applications layout */
.apps-layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 104px); max-height: calc(100vh - 124px); overflow: auto; padding-right: 4px; display: grid; gap: 14px; }
.fgroup { display: grid; gap: 7px; }
.fgroup h5 { margin: 0; font: 500 11.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.fgroup .chip { font-size: 12.5px; padding: 3px 9px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.search { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; }
.search input { border: 0; background: none; padding: 9px 0; flex: 1; min-width: 0; outline: none; }
.search:focus-within { border-color: var(--accent); }
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.result-line { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
.list { display: grid; border-top: 1px solid var(--line); }
.row { text-align: left; display: grid; gap: 5px; padding: 12px 6px; border: 0; border-bottom: 1px solid var(--line); background: none; min-width: 0; border-radius: 0; }
.row:hover { background: var(--surface); }
.row .t { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.row .t strong { font-weight: 600; font-size: 15px; }
.row .t span { color: var(--muted); font-size: 12.5px; }
.row p { margin: 0; color: var(--ink-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.filters-btn { display: none; }

/* Builder */
.builder { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 14px; }
.panel h4 { margin: 0; font: 650 15px var(--f-display); }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); }
.range { display: grid; gap: 4px; }
.range label { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.range output { font-family: var(--f-mono); color: var(--ink); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.summary { background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }
.summary b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.cand { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.cand.weak { opacity: .7; border-style: dashed; }
.cand .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.cand .head b { font: 600 14px var(--f-mono); }
.cand details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.cand ul { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; columns: 2 260px; column-gap: 24px; }
.cand li { break-inside: avoid; margin-bottom: 3px; }
.cand li button { border: 0; background: none; padding: 0; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.stack { display: grid; gap: 10px; }

/* Taxonomy */
.heat-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.heat { border-collapse: separate; border-spacing: 2px; font-size: 12px; width: auto; }
.heat th { font-weight: 500; color: var(--ink-2); text-align: left; white-space: nowrap; padding: 4px 6px; }
.heat thead th { vertical-align: bottom; height: 120px; padding: 0 0 6px; }
.heat thead th div { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; margin: 0 auto; font-size: 12px; }
.heat td { width: 30px; min-width: 30px; height: 26px; border-radius: 4px; padding: 0; }
.heat td button { width: 100%; height: 100%; border: 0; border-radius: 4px; background: transparent; }
.heat td button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.heat .tot { font-family: var(--f-mono); color: var(--muted); text-align: right; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 8px 0 0; flex-wrap: wrap; }
.legend .ramp { display: flex; gap: 2px; }
.legend .ramp i { width: 22px; height: 12px; border-radius: 3px; display: block; }
.cellinfo { min-height: 46px; margin-top: 10px; font-size: 13.5px; color: var(--ink-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 7px; max-width: 260px; box-shadow: var(--shadow); }
.props { display: grid; gap: 14px; margin-top: 8px; }
.prop { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.prop .ph { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.prop .ph h4 { margin: 0; font: 650 16px var(--f-display); }
.prop > p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 80ch; }
.vals { display: grid; gap: 6px; }
.val { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) 120px; gap: 12px; align-items: center; font-size: 13.5px; }
.val .vn { font-weight: 500; }
.val .vn .mono { color: var(--muted); margin-left: 6px; }
.val .vd { color: var(--ink-2); font-size: 13px; }
.bar { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar i { display: block; height: 8px; border-radius: 0 4px 4px 0; background: var(--h4); min-width: 2px; }
.prov { font-size: 11px; font-family: var(--f-mono); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.prov.paper { color: var(--signal); border-color: currentColor; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 8px; margin-top: 18px; }
.note h4 { margin: 0; font: 650 15px var(--f-display); color: var(--ink); }
.note p { margin: 0; }

/* Datasets view */
.tdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; flex: none; }
.t-suite { background: var(--t-suite); }
.t-bench { background: var(--t-bench); }
.t-app { background: var(--t-app); }
.t-generic { background: repeating-linear-gradient(135deg, var(--t-generic) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--t-generic); }
.chartcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 10px; margin: 6px 0 18px; display: grid; gap: 10px; min-width: 0; }
.chart-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.chart-head h3 { margin: 0; font: 650 17px/1.25 var(--f-display); }
.chart-head .hint { margin-top: 2px; }
.chart-ctl { display: flex; gap: 8px; flex-wrap: wrap; }
.legend .lg { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; color: var(--ink-2); }
.legend .sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.legend .sw-line { width: 2px; height: 12px; background: var(--minline); display: inline-block; }
.dchart { display: grid; gap: 3px; min-width: 0; }
.drow { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr) 54px; gap: 10px; align-items: center; min-height: 24px; }
.dlabel { border: 0; background: none; padding: 2px 0; text-align: left; display: flex; gap: 8px; align-items: baseline; min-width: 0; font-size: 13px; color: var(--ink); border-radius: 4px; }
.dlabel .mono { color: var(--muted); flex: none; }
.dlabel .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dlabel:hover .nm { text-decoration: underline; text-underline-offset: 3px; }
.dtrack { position: relative; height: 18px; min-width: 0; }
.dtrack .gl { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--line); opacity: .7; }
.dtrack .minl { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--minline); z-index: 2; }
.dbar { position: absolute; inset: 1px 0; display: flex; gap: 2px; }
.dseg { height: 100%; min-width: 3px; }
.dseg:last-child { border-radius: 0 4px 4px 0; }
.dseg:hover { filter: brightness(1.12); }
.dval { font: 500 12.5px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dval .g { color: var(--muted); margin-left: 4px; font-weight: 400; }
.drow.axis { min-height: 18px; }
.dtrack.ticks { height: 16px; }
.dtrack.ticks span { position: absolute; transform: translateX(-50%); font: 11px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
table.dtable { border-collapse: collapse; width: 100%; font-size: 13px; }
.dtable th, .dtable td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.dtable thead th { font-weight: 500; color: var(--muted); font-size: 12px; white-space: nowrap; }
.dtable th[scope="row"], .dtable thead th:first-child { text-align: left; font-weight: 400; }
.linkish { border: 0; background: none; padding: 0; text-align: left; color: var(--ink); }
.linkish:hover { text-decoration: underline; }
.dsgroup { display: grid; gap: 4px; }
.dsgroup h4 { margin: 4px 0 0; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 2px; }
.dsgroup h4 .n { font: 500 12px var(--f-mono); color: var(--muted); margin-left: 6px; }
.mlist .nm { display: inline-flex; align-items: baseline; text-align: left; }
details.more { border-top: 1px solid var(--line); padding-top: 8px; }
details.more summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
details.more .hint { margin: 6px 0 4px; }
.linkrow { display: flex; gap: 8px; flex-wrap: wrap; }
a.btn { text-decoration: none; color: var(--ink); display: inline-block; }
a.btn.primary { color: var(--accent-ink); }
.tierlbl { display: inline-flex; align-items: center; }
@media (max-width: 700px) {
  .drow { grid-template-columns: minmax(0, 1fr) 46px; row-gap: 2px; }
  .drow .dlabel { grid-column: 1 / -1; }
  .drow .dtrack { grid-column: 1; }
  .drow.axis > span:first-child { display: none; }
}

/* Links and paper references */
.links { display: grid; gap: 2px; }
a.lk { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
a.lk + a.lk { margin-top: 4px; }
a.lk:hover { border-color: var(--accent); }
a.lk .lt { font-weight: 500; min-width: 0; }
a.lk .lh { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
a.lk .ls { font: 500 11px var(--f-mono); color: var(--muted); white-space: nowrap; }
a.lk .ls.ok { color: var(--accent); }
.refs { display: grid; gap: 12px; }
.ref { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.ref .rn { color: var(--signal); padding-top: 1px; }
.ref .rb { display: grid; gap: 3px; }
.ref .rb p { margin: 0; }
.ref .rl { font-size: 13px; }

/* Distributions */
.dist-ctl { gap: 10px 14px; }
.selwrap { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; max-width: 100%; }
.selwrap select { max-width: min(520px, calc(100vw - 110px)); }
#p-hint { max-width: 80ch; margin: 2px 0 6px; }
